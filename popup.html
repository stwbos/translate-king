<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>翻译王 (TranslateKing)</title>
  <link rel="stylesheet" href="/src/popup/popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="brand">
        <img src="/icons/icon-48.png" alt="Logo" class="logo">
        <div>
          <h1 class="title">翻译王</h1>
          <span class="subtitle">全网双语对照，一秒读懂世界</span>
        </div>
      </div>
      <span class="badge-tag">v1.0 开源版</span>
    </header>

    <div class="card main-action-card">
      <div class="setting-row">
        <label for="translationMode">网页翻译模式</label>
        <select id="translationMode" class="lang-select">
          <option value="replace">🇨🇳 纯中文直接替换 (0基础 · 含按钮无感浏览)</option>
          <option value="bilingual" selected>🌐 双语对照伴读 (学英语 · 译文在下方)</option>
        </select>
      </div>

      <div class="setting-row">
        <label for="targetLang">目标译文语言</label>
        <select id="targetLang" class="lang-select">
          <option value="zh-CN" selected>简体中文 (zh-CN)</option>
          <option value="zh-TW">繁体中文 (zh-TW)</option>
          <option value="en">English (en)</option>
          <option value="ja">日本語 (ja)</option>
          <option value="ko">한국어 (ko)</option>
          <option value="fr">Français (fr)</option>
          <option value="de">Deutsch (de)</option>
          <option value="es">Español (es)</option>
          <option value="ru">Русский (ru)</option>
        </select>
      </div>

      <div class="setting-row toggle-row">
        <label for="enableSelection" class="toggle-label">
          <span class="toggle-title">鼠标划词翻译 (中英双向)</span>
          <span class="toggle-desc">划选中/英文词句即刻显示释义与语境</span>
        </label>
        <input type="checkbox" id="enableSelection" class="toggle-switch" checked>
      </div>

      <div id="ytNotice" class="yt-notice" style="display: none; background: rgba(234, 179, 8, 0.12); border: 1px solid rgba(234, 179, 8, 0.35); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 12px; line-height: 1.5; color: #fef08a;">
        <div style="font-weight: bold; margin-bottom: 2px; display: flex; align-items: center; gap: 4px;">
          <span>🎬</span>
          <span>YouTube 实时双语字幕引擎已就绪</span>
        </div>
        <div style="color: #cbd5e1; font-size: 11px;">
          视频播放器右下角已挂载 <b style="color: #fef08a;">[双语 ON]</b> 按钮，支持鼠标悬停自动暂停查词。
        </div>
      </div>

      <button id="toggleBtn" class="primary-btn">
        <span class="btn-icon">⚡</span>
        <span id="btnText">一键开启双语对照 (Alt+T)</span>
      </button>

      <div class="status-indicator">
        <span class="dot"></span>
        <span id="statusText">Microsoft 极速专线已就绪 (免配 Key)</span>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-links">
        <a href="https://github.com/stwbos/translate-king" target="_blank" class="footer-link">GitHub 源码</a>
        <span>·</span>
        <a href="https://stwbos.github.io/translate-king/privacy.html" target="_blank" class="footer-link">隐私政策</a>
      </div>
    </footer>
  </div>

  <script type="module" src="/src/popup/popup.ts"></script>
</body>
</html>
